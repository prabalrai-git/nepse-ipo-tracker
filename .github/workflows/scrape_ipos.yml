name: Scrape IPOs

on:
  schedule:
    # UTC. 00:15 = 09:15 JST / 06:00 NPT;  09:15 = 18:15 JST / 15:00 NPT
    - cron: "15 0 * * *"
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending them (nothing is recorded)"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs overlap: that is how duplicate alerts happen.
concurrency:
  group: scrape-ipos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Where the alert's "View details" button goes (this repo's GitHub Pages site).
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scraper/fetch_ipos.py --dry-run
          else
            python scraper/fetch_ipos.py
          fi

      # Runs even when the step above failed: alert state recorded before a failure
      # (messages already delivered) must be saved or they would be sent again.
      - name: Commit updated data and alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ipos.json scraper/notified_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update IPO data [skip ci]"
            git pull --rebase
            git push
          fi
